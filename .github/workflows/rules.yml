name: rules

# A rule that stops matching does not fail — it goes green. This job is the only
# thing standing between a template edit and a silently ungoverned invariant in
# every project that adopts the skill.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:rules
