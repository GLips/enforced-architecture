name: rules

# A rule that stops matching does not fail — it goes green. This job is the only
# thing standing between a template edit and a silently ungoverned invariant in
# every project that adopts the skill.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Both tiers. `check:rules` needs real Node — oxlint's RuleTester refuses
      # Bun by name — and `harness/with-real-node.sh` arranges that; `check:structural`
      # runs under Bun. Running only one leaves the other tier free to go green
      # while matching nothing, which is the failure this job exists to catch.
      - run: bun run check
