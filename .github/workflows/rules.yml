name: rules

# A rule that stops matching does not fail — it goes green. This job is the only
# thing standing between a template edit and a silently ungoverned invariant in
# every project that adopts the skill.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node, and a version that strips types and globs without a flag. Both
      # tiers run here — a suite proved under one runtime and shipped to another
      # is proved against the wrong host, and `node:fs`'s glob really does answer
      # differently under Bun. See `harness/with-real-node.sh`.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # Types then fixtures, both tiers. `typecheck` is a separate proof, not a
      # duplicate of the fixtures: a template with a type error passes every
      # RuleTester case, and `context.options[0]?.threshold` reading `undefined`
      # compares against NaN and governs nothing while still running green.
      # Running only one tier leaves the other free to go green while matching
      # nothing, which is the failure this job exists to catch.
      - run: npm run check
